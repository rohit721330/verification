<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Verification System</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
        body{background:#0a0a1a;color:#fff;min-height:100vh;padding:20px}
        .admin-container{max-width:1400px;margin:0 auto}
        
        .admin-header{display:flex;justify-content:space-between;align-items:center;padding:20px;background:linear-gradient(135deg,#1a1a3e,#0d0d1f);border-radius:16px;border:1px solid #2a2a5e;margin-bottom:30px}
        .admin-header h1{font-size:28px;background:linear-gradient(135deg,#00ffa3,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .admin-stats{display:flex;gap:30px}
        .stat-item{text-align:center}
        .stat-number{font-size:32px;font-weight:bold;color:#00ffa3}
        .stat-label{font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px}
        
        .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:30px}
        .admin-card{background:linear-gradient(135deg,#141430,#0a0a1a);border:1px solid #2a2a5e;border-radius:16px;padding:25px}
        .admin-card h2{font-size:18px;color:#88aaff;margin-bottom:20px;display:flex;align-items:center;gap:10px}
        
        .form-group{margin-bottom:15px}
        .form-group label{display:block;font-size:13px;color:#aaa;margin-bottom:5px}
        .form-group input,.form-group select{width:100%;padding:12px 16px;background:#1a1a3e;border:1px solid #2a2a5e;border-radius:8px;color:#fff;font-size:14px;transition:0.3s}
        .form-group input:focus,.form-group select:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 20px rgba(59,130,246,0.1)}
        
        .btn{padding:10px 24px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:0.3s;font-size:14px}
        .btn:hover{transform:scale(1.05)}
        .btn-primary{background:#3b82f6;color:#fff}
        .btn-success{background:#00ffa3;color:#000}
        .btn-danger{background:#ff4d4d;color:#fff}
        .btn-warning{background:#f59e0b;color:#000}
        .btn-secondary{background:#2a2a5e;color:#fff}
        
        .table-container{overflow-x:auto;margin-top:20px}
        table{width:100%;border-collapse:collapse;font-size:13px}
        table th{background:#1a1a3e;color:#88aaff;padding:12px;text-align:left;border-bottom:2px solid #2a2a5e}
        table td{padding:12px;border-bottom:1px solid #1a1a3e}
        table tr:hover{background:#1a1a3e}
        
        .status-badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
        .status-verified{background:rgba(0,255,163,0.2);color:#00ffa3}
        .status-pending{background:rgba(59,130,246,0.2);color:#3b82f6}
        .status-failed{background:rgba(255,77,77,0.2);color:#ff4d4d}
        
        .full-width{grid-column:1/-1}
        
        .toast{position:fixed;bottom:30px;right:30px;padding:16px 24px;border-radius:12px;color:#fff;font-weight:600;box-shadow:0 10px 40px rgba(0,0,0,0.5);z-index:9999;transform:translateX(120%);transition:0.5s ease}
        .toast.show{transform:translateX(0)}
        .toast-success{background:linear-gradient(135deg,#00ffa3,#00cc88);color:#000}
        .toast-error{background:linear-gradient(135deg,#ff4d4d,#cc0000)}
        .toast-info{background:linear-gradient(135deg,#3b82f6,#1a5fb4)}
        
        .loading{display:inline-block;width:20px;height:20px;border:3px solid #2a2a5e;border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        
        @media(max-width:768px){.admin-grid{grid-template-columns:1fr}.admin-header{flex-direction:column;gap:20px;text-align:center}.admin-stats{flex-wrap:wrap;justify-content:center}}
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Header -->
        <div class="admin-header">
            <h1>🛡️ Admin Panel</h1>
            <div class="admin-stats">
                <div class="stat-item">
                    <div class="stat-number" id="totalUsers">0</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="verifiedUsers">0</div>
                    <div class="stat-label">Verified</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="pendingUsers">0</div>
                    <div class="stat-label">Pending</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="failedUsers">0</div>
                    <div class="stat-label">Failed</div>
                </div>
            </div>
        </div>
        
        <!-- Grid -->
        <div class="admin-grid">
            <!-- Card 1: Verify User -->
            <div class="admin-card">
                <h2>✅ Verify User</h2>
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="verifyUserId" placeholder="Enter Telegram User ID">
                </div>
                <div class="form-group">
                    <label>Admin Secret</label>
                    <input type="password" id="adminSecret1" placeholder="Enter Admin Secret">
                </div>
                <button class="btn btn-success" onclick="verifyUser()">Verify User</button>
                <span id="verifyResult" style="margin-left:10px;"></span>
            </div>
            
            <!-- Card 2: Search User -->
            <div class="admin-card">
                <h2>🔍 Search User</h2>
                <div class="form-group">
                    <label>User ID</label>
                    <input type="text" id="searchUserId" placeholder="Enter User ID">
                </div>
                <button class="btn btn-primary" onclick="searchUser()">Search</button>
                <div id="searchResult" style="margin-top:15px;"></div>
            </div>
            
            <!-- Card 3: Admin Actions -->
            <div class="admin-card">
                <h2>⚙️ Admin Actions</h2>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <button class="btn btn-secondary" onclick="refreshData()">🔄 Refresh</button>
                    <button class="btn btn-danger" onclick="clearAllData()">🗑️ Clear All Data</button>
                    <button class="btn btn-warning" onclick="exportData()">📥 Export Data</button>
                </div>
                <div style="margin-top:15px;">
                    <div class="form-group">
                        <label>Admin Secret (for destructive actions)</label>
                        <input type="password" id="adminSecret2" placeholder="Enter Admin Secret">
                    </div>
                </div>
            </div>
            
            <!-- Card 4: Quick Actions -->
            <div class="admin-card">
                <h2>📊 Quick Actions</h2>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <button class="btn btn-success" onclick="verifyAllPending()">✅ Verify All Pending</button>
                    <button class="btn btn-danger" onclick="clearSessions()">🔄 Clear Sessions</button>
                    <button class="btn btn-primary" onclick="viewTokens()">🔑 View Tokens</button>
                </div>
            </div>
        </div>
        
        <!-- Full Width: Users Table -->
        <div class="admin-card full-width">
            <h2>👥 All Users</h2>
            <div style="display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;">
                <button class="btn btn-secondary" onclick="filterUsers('all')">All</button>
                <button class="btn btn-success" onclick="filterUsers('verified')">Verified</button>
                <button class="btn btn-primary" onclick="filterUsers('pending')">Pending</button>
                <button class="btn btn-danger" onclick="filterUsers('failed')">Failed</button>
                <input type="text" id="searchInput" placeholder="Search users..." onkeyup="searchTable()" style="padding:8px 16px;background:#1a1a3e;border:1px solid #2a2a5e;border-radius:8px;color:#fff;flex:1;min-width:200px;">
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Username</th>
                            <th>Status</th>
                            <th>Browser</th>
                            <th>OS</th>
                            <th>Verified</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="8" style="text-align:center;padding:40px;color:#666;">
                                <div class="loading"></div> Loading users...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <!-- Toast -->
    <div class="toast" id="toast"></div>
    
    <script>
        // ==================== CONFIGURATION ====================
        const API_BASE = window.location.origin;
        let currentFilter = 'all';
        let allUsers = [];
        
        // ==================== TOAST ====================
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast toast-${type} show`;
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
        
        // ==================== LOAD USERS ====================
        async function loadUsers() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/users`);
                const data = await response.json();
                
                if (data.success) {
                    allUsers = data.users || [];
                    updateStats(data);
                    renderTable(allUsers);
                } else {
                    showToast('Failed to load users', 'error');
                }
            } catch (error) {
                console.error('Load users error:', error);
                showToast('Network error', 'error');
            }
        }
        
        // ==================== UPDATE STATS ====================
        function updateStats(data) {
            document.getElementById('totalUsers').textContent = data.totalUsers || 0;
            document.getElementById('verifiedUsers').textContent = data.verifiedCount || 0;
            
            const pending = data.users ? data.users.filter(u => u.status === 'pending').length : 0;
            const failed = data.users ? data.users.filter(u => u.status === 'failed' || u.status === 'checking_device' || u.status === 'analyzing_security' || u.status === 'final_check').length : 0;
            
            document.getElementById('pendingUsers').textContent = pending;
            document.getElementById('failedUsers').textContent = failed;
        }
        
        // ==================== RENDER TABLE ====================
        function renderTable(users) {
            const tbody = document.getElementById('usersTableBody');
            
            if (!users || users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:#666;">No users found</td></tr>`;
                return;
            }
            
            let filteredUsers = users;
            if (currentFilter !== 'all') {
                filteredUsers = users.filter(u => u.status === currentFilter);
            }
            
            tbody.innerHTML = filteredUsers.map(user => `
                <tr>
                    <td><code>${user.userId}</code></td>
                    <td>${user.firstName || 'N/A'} ${user.lastName || ''}</td>
                    <td>@${user.username || 'N/A'}</td>
                    <td><span class="status-badge status-${user.status === 'verified' ? 'verified' : user.status === 'pending' ? 'pending' : 'failed'}">${user.status}</span></td>
                    <td>${user.browser || 'Unknown'}</td>
                    <td>${user.os || 'Unknown'}</td>
                    <td>${user.isVerified ? '✅ Yes' : '❌ No'}</td>
                    <td>
                        ${!user.isVerified ? `<button class="btn btn-success" style="padding:4px 12px;font-size:11px;" onclick="quickVerify('${user.userId}')">Verify</button>` : ''}
                        <button class="btn btn-secondary" style="padding:4px 12px;font-size:11px;" onclick="viewUser('${user.userId}')">View</button>
                    </td>
                </tr>
            `).join('');
        }
        
        // ==================== VERIFY USER ====================
        async function verifyUser() {
            const userId = document.getElementById('verifyUserId').value.trim();
            const adminSecret = document.getElementById('adminSecret1').value.trim();
            
            if (!userId) {
                showToast('Please enter User ID', 'error');
                return;
            }
            if (!adminSecret) {
                showToast('Please enter Admin Secret', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/admin/verify-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, adminSecret })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(`✅ User ${userId} verified successfully!`, 'success');
                    document.getElementById('verifyResult').innerHTML = '✅ Verified!';
                    loadUsers();
                } else {
                    showToast(data.message || 'Verification failed', 'error');
                    document.getElementById('verifyResult').innerHTML = '❌ Failed';
                }
            } catch (error) {
                console.error('Verify user error:', error);
                showToast('Network error', 'error');
            }
        }
        
        // ==================== QUICK VERIFY ====================
        async function quickVerify(userId) {
            const adminSecret = document.getElementById('adminSecret2').value.trim() || prompt('Enter Admin Secret:');
            
            if (!adminSecret) {
                showToast('Admin secret required', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/admin/verify-user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId, adminSecret })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast(`✅ User ${userId} verified!`, 'success');
                    loadUsers();
                } else {
                    showToast(data.message || 'Verification failed', 'error');
                }
            } catch (error) {
                console.error('Quick verify error:', error);
                showToast('Network error', 'error');
            }
        }
        
        // ==================== SEARCH USER ====================
        async function searchUser() {
            const userId = document.getElementById('searchUserId').value.trim();
            
            if (!userId) {
                showToast('Please enter User ID', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/user-status/${userId}`);
                const data = await response.json();
                
                const resultDiv = document.getElementById('searchResult');
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div style="background:#1a1a3e;padding:15px;border-radius:8px;border:1px solid #2a2a5e;">
                            <p><strong>User ID:</strong> ${data.userId}</p>
                            <p><strong>Status:</strong> <span class="status-badge status-${data.isVerified ? 'verified' : 'pending'}">${data.isVerified ? '✅ Verified' : '⏳ Not Verified'}</span></p>
                            <p><strong>Verified:</strong> ${data.isVerified ? 'Yes' : 'No'}</p>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<div style="color:#ff4d4d;">${data.message || 'User not found'}</div>`;
                }
            } catch (error) {
                console.error('Search user error:', error);
                showToast('Network error', 'error');
            }
        }
        
        // ==================== FILTER USERS ====================
        function filterUsers(filter) {
            currentFilter = filter;
            renderTable(allUsers);
        }
        
        // ==================== SEARCH TABLE ====================
        function searchTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#usersTableBody tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(input) ? '' : 'none';
            });
        }
        
        // ==================== REFRESH ====================
        function refreshData() {
            showToast('🔄 Refreshing...', 'info');
            loadUsers();
        }
        
        // ==================== CLEAR ALL DATA ====================
        async function clearAllData() {
            const adminSecret = document.getElementById('adminSecret2').value.trim();
            
            if (!adminSecret) {
                showToast('Please enter Admin Secret', 'error');
                return;
            }
            
            if (!confirm('⚠️ This will delete ALL user data. Are you sure?')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/admin/clear-data`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminSecret })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('🗑️ All data cleared!', 'success');
                    loadUsers();
                } else {
                    showToast(data.message || 'Clear failed', 'error');
                }
            } catch (error) {
                console.error('Clear data error:', error);
                showToast('Network error', 'error');
            }
        }
        
        // ==================== CLEAR SESSIONS ====================
        async function clearSessions() {
            const adminSecret = document.getElementById('adminSecret2').value.trim();
            
            if (!adminSecret) {
                showToast('Please enter Admin Secret', 'error');
                return;
            }
            
            if (!confirm('⚠️ This will clear all sessions. Are you sure?')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/admin/clear-sessions`, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminSecret })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('🔄 Sessions cleared!', 'success');
                    loadUsers();
                } else {
                    showToast(data.message || 'Clear failed', 'error');
                }
            } catch (error) {
                console.error('Clear sessions error:', error);
                showToast('Network error', 'error');
            }
        }
        
        // ==================== VIEW TOKENS ====================
        async function viewTokens() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/tokens`);
                const data = await response.json();
                
                if (data.success) {
                    let message = `🔑 Total Tokens: ${data.totalTokens}\n\n`;
                    data.tokens.forEach(t => {
                        message += `User ${t.userId}: ${t.status} (${t.createdAt})\n`;
                    });
                    alert(message);
                } else {
                    showToast('Failed to load tokens', 'error');
                }
            } catch (error) {
                console.error('View tokens error:', error);
                showToast('Network error', 'error');
            }
        }
        
        // ==================== EXPORT DATA ====================
        function exportData() {
            if (allUsers.length === 0) {
                showToast('No data to export', 'error');
                return;
            }
            
            const dataStr = JSON.stringify(allUsers, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `admin_export_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📥 Data exported!', 'success');
        }
        
        // ==================== VIEW USER ====================
        function viewUser(userId) {
            document.getElementById('searchUserId').value = userId;
            searchUser();
            document.querySelector('.admin-card').scrollIntoView({ behavior: 'smooth' });
        }
        
        // ==================== VERIFY ALL PENDING ====================
        async function verifyAllPending() {
            const adminSecret = document.getElementById('adminSecret2').value.trim();
            
            if (!adminSecret) {
                showToast('Please enter Admin Secret', 'error');
                return;
            }
            
            const pendingUsers = allUsers.filter(u => u.status === 'pending');
            
            if (pendingUsers.length === 0) {
                showToast('No pending users found', 'info');
                return;
            }
            
            if (!confirm(`⚠️ This will verify ${pendingUsers.length} pending users. Continue?`)) {
                return;
            }
            
            let successCount = 0;
            let failCount = 0;
            
            for (const user of pendingUsers) {
                try {
                    const response = await fetch(`${API_BASE}/api/admin/verify-user`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: user.userId, adminSecret })
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        successCount++;
                    } else {
                        failCount++;
                    }
                } catch (error) {
                    failCount++;
                }
            }
            
            showToast(`✅ ${successCount} verified, ❌ ${failCount} failed`, successCount > 0 ? 'success' : 'error');
            loadUsers();
        }
        
        // ==================== AUTO LOAD ====================
        document.addEventListener('DOMContentLoaded', () => {
            loadUsers();
            setInterval(loadUsers, 30000);
        });
    </script>
</body>
</html>
