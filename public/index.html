<script>
function getUrlParams(){
    const params={};
    const url=window.location.href;
    const hashMatch=url.match(/#tgWebAppData=([^&]*)/);
    if(hashMatch) params.tgWebAppData=decodeURIComponent(hashMatch[1]);
    const urlObj=new URL(url);
    urlObj.searchParams.forEach((value,key)=>{params[key]=value;});
    const botHashMatch=url.match(/[?&]botHash=([^&]*)/);
    if(botHashMatch) params.botHash=botHashMatch[1];
    const botMatch=url.match(/[?&]bot=([^&]*)/);
    if(botMatch) params.bot=botMatch[1];
    const tgWebAppVersionMatch=url.match(/[?&]tgWebAppVersion=([^&]*)/);
    if(tgWebAppVersionMatch) params.tgWebAppVersion=tgWebAppVersionMatch[1];
    const tgWebAppPlatformMatch=url.match(/[?&]tgWebAppPlatform=([^&]*)/);
    if(tgWebAppPlatformMatch) params.tgWebAppPlatform=tgWebAppPlatformMatch[1];
    const tgWebAppThemeParamsMatch=url.match(/[?&]tgWebAppThemeParams=([^&]*)/);
    if(tgWebAppThemeParamsMatch) params.tgWebAppThemeParams=decodeURIComponent(tgWebAppThemeParamsMatch[1]);
    return params;
}

function displayUrlParams(){
    const params=getUrlParams();
    const container=document.getElementById('urlParams');
    let html='<strong>📋 URL Parameters:</strong><br><br>';
    if(Object.keys(params).length===0){
        html+='No parameters found';
    }else{
        for(const [key,value] of Object.entries(params)){
            html+=`<strong>${key}:</strong> ${value.substring(0,100)}${value.length>100?'...':''}<br>`;
        }
    }
    container.innerHTML=html;
}

let paramsVisible=false;
function toggleParams(){
    paramsVisible=!paramsVisible;
    const container=document.getElementById('urlParams');
    if(paramsVisible){
        container.classList.add('show');
        displayUrlParams();
    }else{
        container.classList.remove('show');
    }
}

const tg=window.Telegram.WebApp;
tg.expand();
const urlParams=getUrlParams();
let user=null;
if(tg.initDataUnsafe?.user){
    user=tg.initDataUnsafe.user;
}else if(urlParams.tgWebAppData){
    try{
        const dataParams=new URLSearchParams(urlParams.tgWebAppData);
        const userJson=dataParams.get('user');
        if(userJson) user=JSON.parse(decodeURIComponent(userJson));
    }catch(e){console.log('Error parsing user data:',e);}
}
if(user){
    document.getElementById("profileName").innerText=user.first_name+(user.last_name?" "+user.last_name:"");
    document.getElementById("profileId").innerText="ID: "+user.id;
    if(user.photo_url) document.getElementById("profilePic").src=user.photo_url;
}
console.log('📊 URL Parameters:',urlParams);
console.log('👤 User Data:',user);

function goToPage(pageNum){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    const targetPage=document.getElementById('page'+pageNum);
    if(targetPage) targetPage.classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active-btn'));
    const navBtn=document.getElementById('nav'+pageNum);
    if(navBtn) navBtn.classList.add('active-btn');
    const statusMap={1:'SCANNING',2:'VERIFIED',3:'FAILED',4:'ACTIVE'};
    document.getElementById('statusText').innerText=statusMap[pageNum]||'ACTIVE';
}

let bar=document.getElementById("progressBar");
let percent=document.getElementById("percent");
let statusText1=document.getElementById("statusText1");
let steps=[
    {value:10,text:"Establishing secure handshake..."},
    {value:60,text:"Analyzing device integrity..."},
    {value:90,text:"Final security checks..."},
    {value:100,text:"Verification Complete"}
];
let index=0;
function updateProgress(){
    if(index<steps.length){
        let step=steps[index];
        bar.style.width=step.value+"%";
        percent.innerHTML=step.value+"%";
        statusText1.innerHTML=step.text;
        index++;
        setTimeout(updateProgress,1500);
    }else{
        setTimeout(()=>{goToPage(2);},500);
    }
}
updateProgress();
console.log('✅ Verification System Loaded');
console.log('🔗 URL Structure: https://[domain]/[path]?botHash=[bot_hash]&bot=[bot_username]#tgWebAppData=...');

// Token Manager
class TokenManager {
    constructor() {
        this.token = localStorage.getItem('jwtToken');
    }
    
    setToken(token) {
        this.token = token;
        localStorage.setItem('jwtToken', token);
    }
    
    getAuthHeader() {
        return this.token ? `Bearer ${this.token}` : null;
    }
    
    clearToken() {
        this.token = null;
        localStorage.removeItem('jwtToken');
    }
    
    isTokenValid() {
        if (!this.token) return false;
        try {
            const payload = JSON.parse(atob(this.token.split('.')[1]));
            const now = Math.floor(Date.now() / 1000);
            return payload.exp > now;
        } catch (error) {
            return false;
        }
    }
}

const tokenManager = new TokenManager();

// API Functions
async function initVerification(initData, botHash, bot) {
    try {
        const response = await fetch('/api/init-verification', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData, botHash, bot })
        });
        return await response.json();
    } catch (error) {
        console.error('Init verification error:', error);
        return { success: false, error: 'NETWORK_ERROR' };
    }
}

async function checkStatus(sessionId) {
    try {
        const response = await fetch(`/api/check-status/${sessionId}`, {
            headers: { 'Authorization': tokenManager.getAuthHeader() }
        });
        return await response.json();
    } catch (error) {
        console.error('Check status error:', error);
        return { success: false, error: 'NETWORK_ERROR' };
    }
}

async function checkExistingVerification() {
    if (!tokenManager.isTokenValid()) {
        tokenManager.clearToken();
        return false;
    }
    
    try {
        const response = await fetch('/api/user-profile', {
            headers: { 'Authorization': tokenManager.getAuthHeader() }
        });
        const data = await response.json();
        if (data.success && data.isVerified) {
            return true;
        }
        return false;
    } catch (error) {
        console.error('Check verification error:', error);
        return false;
    }
}

document.addEventListener('DOMContentLoaded', async () => {
    const isVerified = await checkExistingVerification();
    if (isVerified) {
        goToPage(4);
        return;
    }
    
    const urlParams = getUrlParams();
    if (urlParams.tgWebAppData) {
        const result = await initVerification(
            urlParams.tgWebAppData,
            urlParams.botHash || null,
            urlParams.bot || null
        );
        
        if (result.success && result.status === 'already_verified') {
            if (result.token) tokenManager.setToken(result.token);
            goToPage(4);
        } else if (result.success && result.sessionId) {
            if (result.token) tokenManager.setToken(result.token);
            const interval = setInterval(async () => {
                const status = await checkStatus(result.sessionId);
                if (status.status === 'verified') {
                    goToPage(2);
                    clearInterval(interval);
                } else if (status.status === 'failed') {
                    goToPage(3);
                    clearInterval(interval);
                }
            }, 2000);
        }
    }
});
